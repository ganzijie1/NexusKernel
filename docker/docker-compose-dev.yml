name: nexus-kernel-starter-dev

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        NEXUS_KERNEL_RUNTIME_EXTRAS: "${NEXUS_KERNEL_RUNTIME_EXTRAS:-ai,mongo,redis}"
    image: nexus-kernel-starter:dev
    env_file:
      - path: .env.dev
        required: false
    environment:
      NEXUS_KERNEL_RUNTIME_ROLE: api
    ports:
      - "${NEXUS_KERNEL_PORT:-8030}:${NEXUS_KERNEL_PORT:-8030}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${NEXUS_KERNEL_PORT:-8030}/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: nexus-kernel-starter:dev
    env_file:
      - path: .env.dev
        required: false
    environment:
      NEXUS_KERNEL_RUNTIME_ROLE: worker
    profiles: ["worker"]
    depends_on:
      api:
        condition: service_healthy

  mongo:
    image: mongo:8.0
    profiles: ["infra"]
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:8.0-alpine
    profiles: ["infra"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  mongo-data: {}
  redis-data: {}
