[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-kernel-starter"
version = "0.2.0"
description = "A reusable modular AI service foundation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "prometheus-client==0.25.0",
    "loguru==0.7.3",
    "starlette==1.3.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
ai = [
    "google-adk==2.4.0",
    "google-genai==2.12.1",
    "litellm==1.87.0",
    "openai==2.40.0",
]
mongo = ["pymongo==4.17.0"]
redis = ["redis==8.0.1"]
qdrant = ["qdrant-client==1.18.0"]
otel = [
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.1",
]
postgres = ["asyncpg==0.31.0"]
dev = [
    "build==1.5.0",
    "setuptools==83.0.0",
    "packaging==26.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx2==2.7.0",
    "ruff==0.15.21",
    "mypy==2.2.0",
    "pathspec==1.1.1",
    "types-PyYAML==6.0.12.20260518",
    "uv==0.11.29",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexus_kernel*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_llm: explicitly enabled real-model smoke tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
extend-select = ["C90"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.mypy]
python_version = "3.11"
files = ["app", "nexus_kernel"]
strict = true
