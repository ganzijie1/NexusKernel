[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexuskernel-starter"
version = "0.1.0"
description = "A reusable modular AI service foundation."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "PyYAML==6.0.3",
    "prometheus-client==0.25.0",
    "loguru==0.7.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
ai = [
    "google-adk==2.1.0",
    "litellm==1.87.0",
    "openai==2.40.0",
]
mongo = ["pymongo==4.17.0"]
redis = ["redis==8.0.1"]
qdrant = ["qdrant-client==1.18.0"]
otel = [
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.1",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.21",
    "mypy==2.2.0",
    "pathspec==1.1.1",
    "types-PyYAML==6.0.12.20260518",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nexuskernel*", "app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["real_llm: explicitly enabled real-model smoke tests"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = ["app", "nexuskernel"]
strict = true
