service:
  name: NexusKernel Starter
  version: 0.1.0
server:
  host: ${NEXUSKERNEL_HOST:-0.0.0.0}
  port: ${NEXUSKERNEL_PORT:-8030}
  max_request_body_bytes: ${NEXUSKERNEL_MAX_REQUEST_BODY_BYTES:-10485760}
  request_timeout_seconds: ${NEXUSKERNEL_REQUEST_TIMEOUT_SECONDS:-30}
runtime:
  role: ${NEXUSKERNEL_RUNTIME_ROLE:-api}
monitoring:
  metrics_prefix: ${NEXUSKERNEL_METRICS_PREFIX:-nexuskernel}
  metrics_cache_ttl_seconds: ${NEXUSKERNEL_METRICS_CACHE_TTL_SECONDS:-5}
  health_timeout_seconds: ${NEXUSKERNEL_HEALTH_TIMEOUT_SECONDS:-5}
logging:
  level: ${NEXUSKERNEL_LOG_LEVEL:-INFO}
  serialize: ${NEXUSKERNEL_LOG_SERIALIZE:-false}
  request_log_enabled: ${NEXUSKERNEL_REQUEST_LOG_ENABLED:-true}
cors:
  enabled: ${NEXUSKERNEL_CORS_ENABLED:-true}
  allow_origins:
    - "*"
  allow_methods:
    - "*"
  allow_headers:
    - "*"
